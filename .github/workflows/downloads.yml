name: Grafik Unduhan

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/downloads_chart.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Simpan bila berubah
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/downloads.svg
          git diff --cached --quiet || (git commit -m "Perbarui grafik unduhan [skip ci]" && git push)
