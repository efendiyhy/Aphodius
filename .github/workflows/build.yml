name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Versi
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build APK rilis
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${{ steps.ver.outputs.code }}" 2>&1 | tee build.log

      - name: Siapkan APK
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Aphodius-${{ steps.ver.outputs.name }}.apk"
          ls -la dist

      - name: Unggah artefak
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aphodius-apk
          path: dist/*.apk

      - name: Rilis di GitHub Releases
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Aphodius ${{ steps.ver.outputs.name }}
          generate_release_notes: true

      # Jika build gagal, simpan ringkasan log ke branch build-logs supaya mudah dibaca
      - name: Simpan log kegagalan
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/logs
          { echo "run: ${GITHUB_RUN_ID} sha: ${GITHUB_SHA}"; grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Could not|Execution failed" -A3 build.log | head -150; echo ----TAIL----; tail -60 build.log; } > /tmp/logs/last-failure.txt
          git fetch origin build-logs || true
          git checkout --orphan tmp-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/logs/last-failure.txt ./last-failure.txt
          git add last-failure.txt
          git commit -m "build log ${GITHUB_RUN_ID}"
          git push -f origin HEAD:refs/heads/build-logs
